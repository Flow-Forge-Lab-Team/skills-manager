name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: gofmt -w cmd internal
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/skills-manager ./cmd/skills-manager
